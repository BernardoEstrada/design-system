name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@bernardoestrada"

      # Use the Yarn version from package.json's packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck and lint
        run: yarn typecheck && yarn lint

      - name: Build design system
        run: yarn build

      # The tag (v1.2.3) is the source of truth for both package versions.
      - name: Set versions from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm version "$VERSION" --no-git-tag-version --allow-same-version --prefix create-webapp

      - name: Publish @bernardoestrada/design-system
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @bernardoestrada/create-webapp
        run: npm publish
        working-directory: create-webapp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
